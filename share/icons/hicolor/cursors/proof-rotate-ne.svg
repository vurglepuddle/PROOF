<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- PROOF: rotate cursor for the top-right corner of the transform box. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="32" height="32"
     x="-16"
     y="-16"
     style="fill:gray;stroke:black">

  <style>@import './cursors.css';</style>

  <defs>
    <g id="arrow">
      <path d="M 9,12 A 11,11 0 0 1 20,23" style="fill:none"/>
      <path d="M 5.5,12 10,7.5 V 16.5 Z"/>
      <path d="M 20,26.5 15.5,22 H 24.5 Z"/>
    </g>
  </defs>

  <g class="drop-shadow">
    <g id="cursor">
      <use xlink:href="#arrow" style="fill:white;stroke:white;stroke-width:3.5px;stroke-linejoin:round"/>
      <use xlink:href="#arrow" style="fill:black;stroke:black;stroke-width:1.25px;stroke-linejoin:round"/>
    </g>
  </g>
</svg>
