<svg xmlns="http://www.w3.org/2000/svg" width="680" height="384" viewBox="0 0 680 384">
<title>PROOF startup splash</title>
<desc>Compact startup artwork adapted from PROOF's social banner. The loading message and animated bar are drawn below this picture by the application.</desc>
<defs xmlns="http://www.w3.org/2000/svg">
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" />
    <stop offset="1" stop-color="#DCD9D1" />
  </linearGradient>
  <linearGradient id="cobalt" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#5378FF" /><stop offset=".55" stop-color="#3155FF" /><stop offset="1" stop-color="#2441DF" />
  </linearGradient>
  <g id="reg" fill="none" stroke="#F2F0E9" stroke-width="1.25">
    <circle r="9" />
    <path d="M-15 0H15M0-15V15" />
    <path d="M0-4.5A4.5 4.5 0 0 1 0 4.5Z" fill="#F2F0E9" stroke="none" />
    <path d="M0 4.5A4.5 4.5 0 0 1 0-4.5" fill="none" />
  </g>
</defs>



<rect width="680" height="384" fill="#0E1015"/>
<rect width="248" height="384" fill="#090A0D"/>
<rect x="268" y="24" width="388" height="336" fill="#14161C"/>
